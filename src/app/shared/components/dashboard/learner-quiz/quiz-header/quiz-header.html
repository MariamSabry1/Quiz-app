<div class="quiz-header">
  <div class="flex flex-column md:flex-row md:align-items-center md:justify-content-between gap-3">

    <!-- Title + question progress -->
    <div class="flex-1 min-w-0">
      <div class="flex align-items-center justify-content-between mb-2">
        <div>
          <span
            class="quiz-title text-lg md:text-xl font-bold text-color white-space-nowrap overflow-hidden text-overflow-ellipsis">
            {{ quizTitle() }}
          </span>

          <div class="quiz-meta flex align-items-center mt-2">
            <span>{{'quiz_details.type' | translate}}: {{ quizType() }}</span>
            <span class="divider"></span>
            <span> {{'quiz_details.difficulty' | translate}}: {{ quizLevel() }}</span>
          </div>

        </div>

        <div class="flex gap-2 align-items-center">
          <div class="px-2">
            <span class="question-count text-sm font-medium text-color-secondary ml-3 white-space-nowrap">
              {{'questions.question' | translate}} {{ currentQuestion() }} / {{ totalQuestions() }}
            </span>
            <p-progressBar [value]="questionProgress" [showValue]="false" styleClass="question-progress-bar">
            </p-progressBar>
          </div>
          <!-- Timer -->
      <div class="timer-block flex align-items-center gap-3 surface-border">
        <div class="timer-badge flex align-items-center justify-content-center border-circle flex-shrink-0"
          [class.severity-success]="timerSeverity === 'success'" [class.severity-warning]="timerSeverity === 'warning'"
          [class.severity-danger]="timerSeverity === 'danger'">
          <i class="pi pi-clock mr-2"></i>
          <span class="font-bold text-lg">{{ formattedTime }}</span>
        </div>
        </div>
      </div>
      </div>


    </div>
  </div>
