@if (isLoadingQuizzes()) {
<app-loader></app-loader>
} @else {
<div class="grid">
  <div class="col-12 lg:col-6">
    <quiz-app-dashboard-widget
      [title]="('instructor_home.upcoming_quizzes' | translate: { count: upcomingQuizzes().length })"
      [actionLink]="'/dashboard/instructor/quizzes'" [actionLabel]="'instructor_home.quiz_directory' | translate">
      <div class="flex flex-column gap-3">
        @for (quiz of upcomingQuizzes(); track quiz._id) {
        <quiz-app-upcoming-quizzes-card [routingLink]="'quizzes/view-quiz'"
          [quiz]="quiz"></quiz-app-upcoming-quizzes-card>
        }
      </div>
    </quiz-app-dashboard-widget>
  </div>
  <div class="col-12 lg:col-6">
    <quiz-app-dashboard-widget [title]="('instructor_home.students' | translate: { count: topStudents().length })"
      [actionLink]="'/dashboard/instructor/students'" [actionLabel]="'instructor_home.all_students' | translate">
      <div class="flex flex-column gap-3">
        @for (student of topStudents(); track student.id) {
        <quiz-app-top-students-card [student]="student" [studentLink]="''"></quiz-app-top-students-card>
        }
      </div>
    </quiz-app-dashboard-widget>
  </div>
</div>
}
